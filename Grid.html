<div style="text-align: center; background: #0a0a0a; padding: 20px; border-radius: 16px; border: 2px solid #FFD700; box-shadow: 0 0 40px rgba(255, 215, 0, 0.2); max-width: 420px; margin: 0 auto;">
    <h2 style="color: #FFD700; font-family: 'Courier New', monospace;">💣 САПЁР</h2>
    <div style="margin-bottom: 10px;">
        <span style="color: #FFD700;">💣 <span id="mineCount">10</span></span>
        <button onclick="startMinesweeper()" style="background: #FFD700; color: #000; border: none; padding: 6px 16px; border-radius: 8px; font-weight: 700; cursor: pointer;">🔄 Новая игра</button>
    </div>
    <div id="minesweeperBoard" style="display: grid; gap: 2px; justify-content: center; margin: 0 auto; max-width: 100%;"></div>
    <div style="color: #aaa; font-size: 12px; margin-top: 6px;">Нажми на клетку, чтобы открыть. Правый клик — флаг 🚩</div>
</div>

<script>
let board = [];
let mines = [];
let rows = 9, cols = 9, totalMines = 10;
let gameOver = false;
let firstClick = true;

function startMinesweeper() {
    gameOver = false;
    firstClick = true;
    board = Array(rows).fill().map(() => Array(cols).fill(0));
    mines = Array(rows).fill().map(() => Array(cols).fill(false));
    for (let i = 0; i < totalMines; i++) {
        let r, c;
        do { r = Math.floor(Math.random() * rows); c = Math.floor(Math.random() * cols); }
        while (mines[r][c]);
        mines[r][c] = true;
    }
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            if (mines[r][c]) continue;
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && mines[nr][nc]) count++;
                }
            }
            board[r][c] = count;
        }
    }
    renderBoard();
}

function renderBoard() {
    const container = document.getElementById('minesweeperBoard');
    container.style.gridTemplateColumns = `repeat(${cols}, 36px)`;
    container.innerHTML = '';
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const cell = document.createElement('div');
            cell.style.width = '36px';
            cell.style.height = '36px';
            cell.style.background = '#222';
            cell.style.border = '1px solid #444';
            cell.style.display = 'flex';
            cell.style.alignItems = 'center';
            cell.style.justifyContent = 'center';
            cell.style.color = '#FFD700';
            cell.style.fontWeight = '700';
            cell.style.fontSize = '18px';
            cell.style.cursor = 'pointer';
            cell.style.userSelect = 'none';
            cell.dataset.r = r;
            cell.dataset.c = c;
            cell.dataset.revealed = 'false';
            cell.dataset.flagged = 'false';
            cell.textContent = '';
            cell.addEventListener('click', () => handleClick(r, c));
            cell.addEventListener('contextmenu', (e) => { e.preventDefault(); toggleFlag(r, c); });
            container.appendChild(cell);
        }
    }
    document.getElementById('mineCount').textContent = totalMines;
}

function handleClick(r, c) {
    if (gameOver) return;
    if (firstClick) {
        while (mines[r][c]) {
            let nr = Math.floor(Math.random() * rows), nc = Math.floor(Math.random() * cols);
            mines[r][c] = false;
            mines[nr][nc] = true;
            startMinesweeper();
            return;
        }
        firstClick = false;
    }
    if (mines[r][c]) {
        gameOver = true;
        revealAll();
        return;
    }
    reveal(r, c);
}

function reveal(r, c) {
    const idx = r * cols + c;
    const cell = document.querySelectorAll('#minesweeperBoard div')[idx];
    if (!cell || cell.dataset.revealed === 'true' || cell.dataset.flagged === 'true') return;
    cell.dataset.revealed = 'true';
    cell.style.background = '#111';
    const val = board[r][c];
    if (val > 0) {
        cell.textContent = val;
        cell.style.color = ['#FFD700', '#ff4444', '#66bb6a', '#ffaa00', '#ff69b4', '#00bfff', '#aa88ff', '#ff8c00'][val - 1] || '#fff';
    } else {
        cell.textContent = '';
        for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) reveal(nr, nc);
            }
        }
    }
}

function toggleFlag(r, c) {
    if (gameOver) return;
    const idx = r * cols + c;
    const cell = document.querySelectorAll('#minesweeperBoard div')[idx];
    if (!cell || cell.dataset.revealed === 'true') return;
    if (cell.dataset.flagged === 'false') {
        cell.dataset.flagged = 'true';
        cell.textContent = '🚩';
        cell.style.color = '#ff4444';
    } else {
        cell.dataset.flagged = 'false';
        cell.textContent = '';
    }
    let flagCount = 0;
    document.querySelectorAll('#minesweeperBoard div').forEach(el => {
        if (el.dataset.flagged === 'true') flagCount++;
    });
    document.getElementById('mineCount').textContent = totalMines - flagCount;
}

function revealAll() {
    document.querySelectorAll('#minesweeperBoard div').forEach((cell, idx) => {
        const r = Math.floor(idx / cols), c = idx % cols;
        if (mines[r][c]) {
            cell.textContent = '💣';
            cell.style.background = '#440000';
        } else {
            cell.dataset.revealed = 'true';
            cell.style.background = '#111';
        }
    });
}

startMinesweeper();
</script>
