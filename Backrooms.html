<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Backrooms — Level 0 | RIVE GAMES</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
        background: #000; color: #fff;
        font-family: 'Courier New', monospace;
        width: 100%; height: 100%;
        overflow: hidden;
        user-select: none; -webkit-user-select: none;
    }
    body {
        display: flex; justify-content: center; align-items: center;
        padding: 4px;
    }
    .game-wrap {
        width: min(calc(100vw - 8px), calc((100vh - 8px) * 0.732));
        max-width: 620px;
        aspect-ratio: 600 / 820;
        background: #0a0a10;
        border: 3px solid #f5d76e;
        border-radius: 12px;
        padding: 4px;
        box-shadow: 0 0 25px rgba(245, 215, 110, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
    }
    #gameCanvas {
        display: block;
        width: 100%; height: 100%;
        background: #000;
        border-radius: 8px;
        touch-action: none;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="game-wrap">
    <canvas id="gameCanvas" width="600" height="820"></canvas>
</div>

<!-- ═══════════════════════════════════════════════════════════
     МОДУЛИ BACKROOMS · СБОРКА СОЮЗА
     ═══════════════════════════════════════════════════════════

     Порядок загрузки ВАЖЕН:
     1. config    — константы, утилиты, настройки
     2. audio     — звуки и TTS
     3. render    — raycasting и отрисовка
     4. entities  — сущности и ИИ
     5. items     — мебель и предметы
     6. ui        — HUD и мобильное управление
     7. intro     — заставка, меню, смерть
     8. core      — ЗАПУСКАЕТ игру (последний!)
-->

<!-- 1. КОНСТАНТЫ И НАСТРОЙКИ -->
<script src="Backrooms/config.js"></script>

<!-- 2. ЗВУКИ (загружаются следующими) -->
<script src="Backrooms/audio.js"></script>

<!-- 3. РЕНДЕР (функции отрисовки) -->
<script src="Backrooms/render.js"></script>

<!-- 4. СУЩНОСТИ (Smiler, Hound) -->
<script src="Backrooms/entities.js"></script>

<!-- 5. ПРЕДМЕТЫ И МЕБЕЛЬ -->
<script src="Backrooms/items.js"></script>

<!-- 6. UI (HUD, инвентарь, мобильное управление) -->
<script src="Backrooms/ui.js"></script>

<!-- 7. ИНТРО И ЭКРАНЫ (заставка, меню, смерть) -->
<script src="Backrooms/intro.js"></script>

<!-- 8. ЯДРО (запускает всё) -->
<script src="Backrooms/core.js"></script>

</body>
</html>
